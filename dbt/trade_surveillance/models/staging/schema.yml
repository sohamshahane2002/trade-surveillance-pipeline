version: 2

models:
  - name: stg_trades
    description: "Cleaned and standardized trades from raw_trades table"
    columns:
      - name: trade_id
        description: "Unique trade identifier"
        tests:
          - unique
          - not_null
      - name: trader_id
        tests:
          - not_null
      - name: order_type
        tests:
          - not_null
          - accepted_values:
              values: ['BUY', 'SELL']
      - name: quantity
        tests:
          - not_null
      - name: price
        tests:
          - not_null